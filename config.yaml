# config.yaml — generated from Jira story TER-1219
name: faq-router-agent
description: >-
  LangGraph agent that classifies incoming user questions and routes them
  to the correct billing, account, or technical FAQ answer node.
framework: langgraph
version: 1.0.0

environment_variables:
  LLM_MODEL: gpt-4o-mini

  # LiteLLM proxy (optional — leave blank to use OpenAI directly)
  LITELLM_BASE_URL: ""
  LITELLM_API_KEY: ""
  LITELLM_MODEL: ""

  # Opik observability (optional)
  ENABLE_OPIK_TRACING: "false"
  OPIK_PROJECT_NAME: faq-router-agent
  OPIK_URL_OVERRIDE: ""
  OPIK_API_KEY: ""
